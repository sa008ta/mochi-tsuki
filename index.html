    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime);

    const g = c.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  } catch (e) {}
}

// speed trails (modelled on the swing game the user pointed at): a continuous arc band behind the moving hand and the kine head — thin and faint early, thick and bright as the clock-driven tempo rises. No camera effects.
class Trail {
  constructor(color, maxPts) {
    this.maxPts = maxPts; this.pts = [];
    const g = new THREE.BufferGeometry();
    this.posAttr = new THREE.BufferAttribute(new Float32Array(maxPts * 2 * 3), 3);
    this.posAttr.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.posAttr);
    const idx = [];
    for (let i = 0; i < maxPts - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    g.setIndex(idx);
    this.mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
    this.mesh.frustumCulled = false; this.mesh.visible = false;
    scene.add(this.mesh);
  }
  push(p) { this.pts.unshift(p.x, p.y, p.z); if (this.pts.length > this.maxPts * 3) this.pts.length = this.maxPts * 3; }
  update(camPos, width, opacity) {
    const n = this.pts.length / 3;
    if (n < 3 || opacity <= 0.01) { this.mesh.visible = false; return; }
    this.mesh.visible = true;
    const arr = this.posAttr.array, P = this.pts;
    for (let i = 0; i < this.maxPts; i++) {
      const j = Math.min(i, n - 1) * 3, k = Math.min(i + 1, n - 1) * 3;
      const dx = P[j] - P[k], dy = P[j + 1] - P[k + 1], dz = P[j + 2] - P[k + 2];
      const vx = camPos.x - P[j], vy = camPos.y - P[j + 1], vz = camPos.z - P[j + 2];
      let sx = dy * vz - dz * vy, sy = dz * vx - dx * vz, sz = dx * vy - dy * vx;
      const sl = Math.hypot(sx, sy, sz) || 1; sx /= sl; sy /= sl; sz /= sl;
      const w = width * (1 - (i / this.maxPts) * 0.75);
      arr[i * 6] = P[j] + sx * w; arr[i * 6 + 1] = P[j + 1] + sy * w; arr[i * 6 + 2] = P[j + 2] + sz * w;
      arr[i * 6 + 3] = P[j] - sx * w; arr[i * 6 + 4] = P[j + 1] - sy * w; arr[i * 6 + 5] = P[j + 2] - sz * w;
    }
    this.posAttr.needsUpdate = true;
    this.mesh.material.opacity = opacity;
  }
  clear() { this.pts.length = 0; this.mesh.visible = false; }
}

/* --- partner cycle: hand out -> in (flip) -> out, just faster and faster --- */
function partnerStep(dt) {
  G.cycleT -= dt;
  if (G.cycle === 'out' && G.cycleT <= 0) {
    G.cycle = 'in'; G.flipped = false;
    sndEntry();
    G.handTarget = 1; G.cycleT = flipDur();
  } else if (G.cycle === 'in' && G.cycleT <= 0) {
    G.cycle = 'out'; G.handTarget = 0; G.cycleT = gapDur();
  }
  const rate = G.handTarget > G.handPos ? 6.5 : 8.5;
  const d = clamp(G.handTarget - G.handPos, -rate * dt, rate * dt);
  G.handPos += d;
  if (G.handPos > 0.85 && !G.flipped) {
    G.flipped = true;
    G.flipT = 0;
    mochiG.rotation.z = 0;
    sndFlip();
  }
  applyPartner(G.handPos, G.handPos);
}

/* --- pounding --- */
function startPound() {
  if (G.phase !== 'play') return;
  if (G.swingT >= 0 && G.swingT < 0.62) { G.buffered = true; return; } // a tap mid-swing is buffered, not dropped — it fires the next swing at impact (mashing felt unresponsive when taps vanished)
  G.swingT = 0; G.impacted = false;
  ac();
}
function judge() {
  if (G.handPos > 0.62) { handHit(); return; }
  G.pounds++; G.inMochi++;
  G.squash = 1;
  burst();
  spawnSparks();
  sndPound();
  updateHud();
}

function buildShareImage() {

  cv.width = S; cv.height = S;
  const g = cv.getContext('2d');
  const src = renderer.domElement;
  const side = Math.min(src.width, src.height);
  g.drawImage(src, (src.width - side) / 2, (src.height - side) / 2, side, side, 0, 0, S, S);
  const grad = g.createLinearGradient(0, S * 0.62, 0, S);
  grad.addColorStop(0, 'rgba(20,10,4,0)');
  grad.addColorStop(1, 'rgba(20,10,4,0.88)');
  g.fillStyle = grad; g.fillRect(0, S * 0.62, S, S * 0.38);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = '900 74px sans-serif';
  g.fillText('餅つき名人', S / 2, S * 0.8);
  g.font = '900 96px sans-serif'; g.fillStyle = '#ffd94d';
  g.fillText(G.pounds + '回叩いた！', S / 2, S * 0.9);
  g.font = '700 44px sans-serif'; g.fillStyle = '#fff';

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - lastT) / 1000, 0, 0.05);
  lastT = now;
  const time = now / 1000;

  if (G.phase === 'play') {
    G.timeS += dt;
    const tt = Math.max(0, LIMIT - G.timeS).toFixed(1);
    if ($('timeNum').textContent !== tt) $('timeNum').textContent = tt;
    if (G.timeS >= LIMIT) timeUp();
    else { partnerStep(dt); swingStep(dt); }
  } else if (G.phase === 'hit') {
    G.hitT += dt;
    G.handPos = Math.max(0, G.handPos - dt * 7);
    const u = clamp(G.hitT / 0.35, 0, 1);
    applyPartner(G.handPos, -0.85 * u);
    swingStep(dt);
    if (G.hitT > 1.15) startEnding();
  } else if (G.phase === 'done') {
    G.doneT += dt;
    swingStep(dt);
    if (G.doneT > 1.15) startEnding();
  } else if (G.phase === 'ending') {
    endingStep(dt);
  } else {
    swingStep(dt);
  }

  // mochi squash / flatten / flip / swap
  G.squash *= Math.exp(-9 * dt);
  const flat = clamp(1 - G.inMochi * 0.006, 0.7, 1); // the mochi flattens as the 20 seconds of pounding add up
  const grow = 1 + G.inMochi * 0.005;
  const shine = clamp(G.inMochi / 35, 0, 1); // a golden glow spreads from the center with every pound; at 35 the whole mochi glows
  const gr2 = (0.08 + shine * 0.5) * grow; // kept inside the mochi's silhouette: the light stays on the mochi, the whole-body glow at max comes from the emissive below
  glowDisc.scale.set(gr2, gr2, 1);
  glowDisc.position.y = 0.30 + 0.17 * flat * (1 - G.squash * 0.4) + 0.04;
  glowMat.opacity = shine * 0.55;
  mochiMat.emissive.setRGB(0.3 * shine * shine, 0.19 * shine * shine, 0.02 * shine * shine);
  glowLight.intensity = shine * 6; // not just a tint: the mochi actually lights the room as it glows
  let my = 1.06, mScaleY = 0.55 * flat * (1 - G.squash * 0.45);
  mochiMain.scale.set(grow * (1 + G.squash * 0.22), mScaleY / 0.55 * 0.55, grow * (1 + G.squash * 0.22));
  mochiMain.scale.y = mScaleY;
  mochiTop.scale.set(grow, 0.55 * flat * (1 - G.squash * 0.4), grow);
  if (G.flipT >= 0) {
    G.flipT += dt / 0.32;
    if (G.flipT >= 1) { G.flipT = -1; G.mochiRot += Math.PI; mochiG.rotation.x = G.mochiRot; mochiG.position.y = 1.06; }
    else {
      mochiG.position.y = 1.06 + Math.sin(G.flipT * Math.PI) * 0.34;
      mochiG.rotation.x = G.mochiRot + G.flipT * Math.PI;
    }
  }
  if (G.swapT >= 0) {
    G.swapT += dt / 0.6;
    const t = G.swapT;
    if (t < 0.5) {
      const u = t / 0.5;
      mochiG.position.x = 2.6 * u * 0.8;
      mochiG.position.z = 1.15 * u * 0.8;
      mochiG.position.y = 1.06 + Math.sin(u * Math.PI) * 0.4;
    } else if (t < 0.55) {
      if (!G.swapped) { G.swapped = true; addTrayMochi(); mochiG.position.set(0, 2.1, 0); }
    } else {
      const u = (t - 0.55) / 0.45;
      mochiG.position.y = 2.1 - (2.1 - 1.06) * easeOut(u);
      if (t >= 1) { G.swapT = -1; G.swapped = false; mochiG.position.set(0, 1.06, 0); }
    }
  }
  if (G.flipT < 0 && G.swapT < 0) { // while the hand is in (even hidden under the mochi), the mochi itself keeps moving: pulled toward the partner and kneaded — a moving mochi means hands on it
    mochiG.position.x = G.handPos * 0.13;
    mochiG.position.z = G.handPos * 0.09;
    const knead = G.handPos > 0.6 ? (G.handPos - 0.6) / 0.4 : 0;
    mochiG.rotation.z = Math.sin(time * 26) * 0.04 * knead;
    mochiG.position.y = 1.06 + Math.abs(Math.sin(time * 26)) * 0.018 * knead;
  }
  // steam + bursts
  for (const s of steams) {
    s.position.y += dt * 0.32;
    s.position.x += Math.sin(time * 1.4 + s.userData.ph) * dt * 0.12;
    if (s.position.y > 2.5) { s.position.y = 1.4; s.position.x = rand(-0.3, 0.3); }
    s.material.opacity = 0.32 * (1 - (s.position.y - 1.4) / 1.1);

  for (let i = bursts.length - 1; i >= 0; i--) {
    const s = bursts[i];
    s.userData.life -= dt;
    if (s.userData.life <= 0) { scene.remove(s); bursts.splice(i, 1); continue; }
    s.position.addScaledVector(s.userData.v, dt);
    s.userData.v.y -= 2.6 * dt;
    s.material.opacity = s.userData.life / 0.55 * 0.8;
